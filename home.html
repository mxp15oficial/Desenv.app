<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Desenv.app</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            text-align: center;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .btn-sair {
            padding: 8px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .btn-sair:hover {
            background-color: #0056b3;
        }

        /* Grade de 3 colunas (exatamente como você desenhou) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #222;
        }

        .card h3 {
            font-size: 12px;
            margin: 8px 0 4px 0;
        }

        .card p {
            font-size: 11px;
            color: #007bff;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        .btn-comprar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            width: 100%;
        }

        .btn-comprar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
