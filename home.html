<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma - Desenv.app</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 5px 15px 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 19px;
            margin: 2px 0;
            text-align: center;
        }
        p {
            color: #aaaaaa;
            margin: 2px 0 8px 0;
            font-size: 12px;
            text-align: center;
        }
        .btn-sair {
            padding: 5px 14px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-sair:hover {
            background-color: #0056b3;
        }

        /* Grade de produtos */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .card img:hover {
            opacity: 0.8;
        }

        .card h3 {
            font-size: 12px;
            margin: 8px 0 4px 0;
        }

        .card p {
            font-size: 11px;
            color: #007bff;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        .btn-comprar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            width: 100%;
        }

        .btn-comprar:hover {
            background-color: #0056b3;
        }

        /* Janela Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .modal-title {
            color: #fff;
            margin-top: 15px;
            font-size: 18px;
        }

        .modal-price {
            color: #007bff;
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0 15px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .btn-modal-comprar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }

        .btn-modal-fechar {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Bem-vindo ao Desenv.app!</h1>
    <p>Escolha um projeto para visualizar e decidir.</p>
    <a href="index.html" class="btn-sair">Sair (Logout)</a>

    <!-- Grade -->
    <div class="grid-container" id="productGrid">
        <!-- Os produtos serão carregados aqui -->
    </div>

    <!-- Janela Modal -->
    <div id="imageModal" class="modal">
        <img class="modal-content" id="modalImg" alt="Detalhe do App">
        <div class="modal-title" id="modalTitle">Nome do App</div>
        <div class="modal-price" id="modalPrice">R$ 0,00</div>
        <div class="modal-buttons">
            <button class="btn-modal-fechar" onclick="fecharModal()">Voltar</button>
            <button class="btn-modal-comprar" onclick="comprarItem()">Comprar</button>
        </div>
    </div>

    <script>
        const produtos = [
            { id: 1, nome: "App 1", preco: "R$ 29,90", imagem: "4085.jpg" },
            { id: 2, nome: "App 2", preco: "R$ 39,90", imagem: "4085.jpg" },
            { id: 3, nome: "App 3", preco: "R$ 49,90", imagem: "4085.jpg" },
            { id: 4, nome: "App 4", preco: "R$ 19,90", imagem: "4085.jpg" },
            { id: 5, nome: "App 5", preco: "R$ 59,90", imagem: "4085.jpg" },
            { id: 6, nome: "App 6", preco: "R$ 69,90", imagem: "4085.jpg" },
            { id: 7, nome: "App 7", preco: "R$ 99,90", imagem: "4085.jpg" },
            { id: 8, nome: "App 8", preco: "R$ 89,90", imagem: "4085.jpg" },
            { id: 9, nome: "App 9", preco: "R$ 79,90", imagem: "4085.jpg" }
        ];

        const grid = document.getElementById("productGrid");
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const modalTitle = document.getElementById("modalTitle");
        const modalPrice = document.getElementById("modalPrice");

        produtos.forEach(prod => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${prod.imagem}" alt="${prod.nome}" onclick="abrirModal('${prod.imagem}', '${prod.nome}', '${prod.preco}')">
                <h3>${prod.nome}</h3>
                <p>${prod.preco}</p>
                <button class="btn-comprar" onclick="abrirModal('${prod.imagem}', '${prod.nome}', '${prod.preco}')">Ver & Comprar</button>
            `;
            grid.appendChild(card);
        });

        function abrirModal(imagem, nome, preco) {
            modal.style.display = "flex";
            modalImg.src = imagem;
            modalTitle.innerText = nome;
            modalPrice.innerText = preco;
        }

        function fecharModal() {
            modal.style.display = "none";
        }

        function comprarItem() {
            alert("Redirecionando para o pagamento seguro!");
            fecharModal();
        }
    </script>

</body>
  </html>
