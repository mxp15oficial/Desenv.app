<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Área Protegida</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width:800px; margin:40px auto; padding:0 16px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    h1 { margin:0; }
    button { padding:8px 12px; font-size:14px; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Bem-vindo</h1>
    <button id="logout">Sair</button>
  </header>

  <main>
    <p id="greeting"></p>
    <p>Esta é a área protegida: somente acessível após login.</p>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cur = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!cur) {
        // Not logged in -> redirect to login
        location.href = 'login.html';
        return;
      }
      document.getElementById('greeting').textContent = 'Olá, ' + (cur.name || cur.email) + '!';

      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('currentUser');
        location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
