<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma - Desenv.app</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            text-align: center;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .btn-sair {
            padding: 8px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .btn-sair:hover {
            background-color: #0056b3;
        }

        /* Grade de produtos principal */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .card img:hover {
            opacity: 0.8;
        }

        .card h3 {
            font-size: 12px;
            margin: 8px 0 4px 0;
        }

        .card p {
            font-size: 11px;
            color: #007bff;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        .btn-comprar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            width: 100%;
        }

        .btn-comprar:hover {
            background-color: #0056b3;
        }

        /* Janela Modal ajustada para conter a grade de 6 quadrados */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.96);
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding-top: 5px;
            padding-left: 15px;
            padding-right: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-title {
            color: #00ff88;
            margin-top: 2px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }

        .modal-price {
            color: #007bff;
            font-size: 13px;
            font-weight: bold;
            margin: 2px 0 6px 0;
            text-align: center;
            width: 100%;
        }

        /* Sub-grade com os 6 quadrados dentro do modal */
        .modal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
        }

        .modal-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 4px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .modal-card:hover {
            border-color: #007bff;
        }

        .modal-card img {
            width: 100%;
            height: 50px;
            object-fit: cover;
            border-radius: 3px;
        }

        .modal-card span {
            font-size: 9px;
            color: #ccc;
            display: block;
            margin-top: 2px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-modal-comprar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 6px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-modal-fechar {
            background-color: #333;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 6px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-size: 12px;
        }

        /* Mini-modal para ver a foto clicada dos 6 quadrados em tela cheia */
        .zoom-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .zoom-content {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .btn-fechar-zoom {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Bem-vindo ao Desenv.app!</h1>
    <p>Escolha um projeto para visualizar e decidir.</p>
    <a href="index.html" class="btn-sair">Sair (Logout)</a>

    <!-- Grade Principal -->
    <div class="grid-container" id="productGrid">
        <!-- Os produtos serão carregados aqui -->
    </div>

    <!-- Janela Modal que contém os 6 quadrados -->
    <div id="imageModal" class="modal">
        <div class="modal-title" id="modalTitle">🔥 Veja os detalhes exclusivos</div>
        <div class="modal-price" id="modalPrice">R$ 0,00</div>
        
        <!-- Grade com os 6 quadrados de fotos -->
        <div class="modal-grid" id="modalGridFotos">
            <!-- Gerado via JavaScript -->
        </div>

        <div class="modal-buttons">
            <button class="btn-modal-fechar" onclick="fecharModal()">Voltar</button>
            <button class="btn-modal-comprar" onclick="comprarItem()">Comprar</button>
        </div>
    </div>

    <!-- Modal para dar Zoom na foto individual dos 6 quadrados -->
    <div id="zoomModal" class="zoom-modal">
        <img class="zoom-content" id="zoomImg" alt="Foto Ampliada">
        <button class="btn-fechar-zoom" onclick="fecharZoom()">Fechar Foto</button>
    </div>

    <!-- Script -->
    <script>
        const produtos = [
            { id: 1, nome: "App 1", preco: "R$ 29,90", imagem: "4085.jpg" },
            { id: 2, nome: "App 2", preco: "R$ 39,90", imagem: "4085.jpg" },
            { id: 3, nome: "App 3", preco: "R$ 49,90", imagem: "4085.jpg" },
            { id: 4, nome: "App 4", preco: "R$ 19,90", imagem: "4085.jpg" },
            { id: 5, nome: "App 5", preco: "R$ 59,90", imagem: "4085.jpg" },
            { id: 6, nome: "App 6", preco: "R$ 69,90", imagem: "4085.jpg" },
            { id: 7, nome: "App 7", preco: "R$ 99,90", imagem: "4085.jpg" },
            { id: 8, nome: "App 8", preco: "R$ 89,90", imagem: "4085.jpg" },
            { id: 9, nome: "App 9", preco: "R$ 79,90", imagem: "4085.jpg" }
        ];

        const grid = document.getElementById("productGrid");
        const modal = document.getElementById("imageModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalPrice = document.getElementById("modalPrice");
        const modalGridFotos = document.getElementById("modalGridFotos");
        
        const zoomModal = document.getElementById("zoomModal");
        const zoomImg = document.getElementById("zoomImg");

        // Desenha a grade principal de apps
        produtos.forEach(prod => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${prod.imagem}" alt="${prod.nome}" onclick="abrirModal('${prod.nome}', '${prod.preco}', '${prod.imagem}')">
                <h3>${prod.nome}</h3>
                <p>${prod.preco}</p>
                <button class="btn-comprar" onclick="abrirModal('${prod.nome}', '${prod.preco}', '${prod.imagem}')">Ver & Comprar</button>
            `;
            grid.appendChild(card);
        });

        function abrirModal(nome, preco, imagemPadrao) {
            modal.style.display = "flex";
            modalTitle.innerText = "🔥 Veja os detalhes exclusivos do " + nome;
            modalPrice.innerText = preco;

            // Limpa e cria os 6 quadrados dentro do modal
            modalGridFotos.innerHTML = "";
            for (let i = 1; i <= 6; i++) {
                const subCard = document.createElement("div");
                subCard.className = "modal-card";
                subCard.innerHTML = `
                    <img src="${imagemPadrao}" alt="Foto ${i}">
                    <span>Foto ${i}</span>
                `;
                // Ao clicar em qualquer um dos 6 quadrados, abre a foto ampliada
                subCard.onclick = function() {
                    abrirZoom(imagemPadrao);
                };
                modalGridFotos.appendChild(subCard);
            }
        }

        function fecharModal() {
            modal.style.display = "none";
        }

        function abrirZoom(imagem) {
            zoomModal.style.display = "flex";
            zoomImg.src = imagem;
        }

        function fecharZoom() {
            zoomModal.style.display = "none";
        }

        function comprarItem() {
            alert("Redirecionando para o pagamento seguro!");
            fecharModal();
        }
    </script>

</body>
</html>
