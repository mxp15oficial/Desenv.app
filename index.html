<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MXP$15</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            width: 100%;
            max-width: 320px;
            padding: 20px;
            background: #111111;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #222222;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-secundario {
            background-color: #333333;
            margin-top: 10px;
        }
        .btn-secundario:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>

<div class="login-box">
    <img src="4085.jpg" width="100" alt="Logo" style="border-radius: 50%; margin-bottom: 10px;">
    <h1>ENTRAR</h1>
    
    <form id="formLogin">
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">ENTRAR</button>
    </form>
    
    <button type="button" class="btn-secundario" onclick="window.location.href='registro.html'">CRIAR CONTA</button>
</div>

<!-- Biblioteca do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://guavczqfnqkshhgpyccs.supabase.co';
    const supabaseKey = 'sb_publishable_1qUbWglTgDfCV4MIDT7qWQ_jetIG_ht';
    
    // Verifica se o Supabase carregou
    if (typeof supabase === 'undefined') {
        alert("Erro: A biblioteca do Supabase não carregou. Verifique sua internet.");
    } else {
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById("formLogin").addEventListener("submit", async function(e){
            e.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            try {
                const { data, error } = await client.auth.signInWithPassword({ 
                    email: email, 
                    password: senha 
                });

                if (error) throw error;

                // Salva a marcação para liberar o acesso na home
                localStorage.setItem("usuarioLogado", "true");

                alert("Login realizado com sucesso!");
                window.location.href = "home.html";
                
            } catch(err) {
                alert("Erro ao entrar: " + err.message);
            }
        });
    }
</script>

</body>
</html>
