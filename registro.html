<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Cadastro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width:600px; margin:40px auto; padding:0 16px; }
    h1 { text-align:center; }
    form { display:flex; flex-direction:column; gap:10px; }
    input { padding:8px; font-size:16px; }
    button { padding:10px; font-size:16px; cursor:pointer; }
    .info { color: #555; }
    .error { color: #b30000; }
    .success { color: #007700; }
    .actions { display:flex; gap:8px; }
  </style>
</head>
<body>
  <h1>Cadastro</h1>
  <div id="message" class="info">Preencha os dados para criar seu cadastro.</div>

  <form id="registerForm">
    <input type="text" id="name" placeholder="Nome" required />
    <input type="email" id="email" placeholder="E-mail" required />
    <input type="password" id="password" placeholder="Senha" required minlength="6" />
    <input type="password" id="confirm" placeholder="Confirmar senha" required minlength="6" />
    <div class="actions">
      <button type="submit">Cadastrar</button>
      <button type="button" id="goLogin">Ir para Login</button>
    </div>
    <div id="feedback"></div>
  </form>

  <script>
    // Helpers
    async function hashSHA256(text) {
      const enc = new TextEncoder();
      const data = enc.encode(text);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem('users') || 'null');
      } catch (e) { return null; }
    }

    function saveUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }

    // On load: if there's already a user, disable registration and show message
    document.addEventListener('DOMContentLoaded', () => {
      const users = getUsers();
      const msg = document.getElementById('message');
      const form = document.getElementById('registerForm');
      const feedback = document.getElementById('feedback');

      if (users && users.length > 0) {
        // According to your requirement: if already registered, only login is allowed
        msg.textContent = 'Já existe cadastro. Apenas login é permitido.';
        feedback.innerHTML = '<p class="info">Clique em "Ir para Login" para acessar.</p>';
        // disable form inputs
        Array.from(form.elements).forEach(el => {
          if (el.id !== 'goLogin') el.disabled = true;
        });
      }

      document.getElementById('goLogin').addEventListener('click', () => {
        location.href = 'login.html';
      });

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        feedback.textContent = '';
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (!name || !email || !password) {
          feedback.innerHTML = '<p class="error">Preencha todos os campos.</p>';
          return;
        }
        if (password !== confirm) {
          feedback.innerHTML = '<p class="error">Senhas não conferem.</p>';
          return;
        }

        const existing = getUsers();
        if (existing && existing.length > 0) {
          // block new registrations per requirement
          feedback.innerHTML = '<p class="error">Já existe um cadastro. Apenas login permitido.</p>';
          return;
        }

        const pwdHash = await hashSHA256(password);
        const usersToSave = [{ name, email, pwdHash }];
        saveUsers(usersToSave);
        feedback.innerHTML = '<p class="success">Cadastro realizado com sucesso! Redirecionando para login...</p>';
        setTimeout(() => location.href = 'login.html', 1200);
      });
    });
  </script>
</body>
</html>
